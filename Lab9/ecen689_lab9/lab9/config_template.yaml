GHDL_ARGUMENTS:
  - "--std=08"
CLOCK_PORT: clk
CLOCK_PERIOD: 50          # <- YOUR TARGET in ns (50 = 20 MHz). Changeable per run.
PDN_MULTILAYER: false     # your core becomes a macro later - it may NOT own met5
RT_MAX_LAYER: met4        # same reason - do not change
FP_SIZING: absolute
DIE_AREA: [0, 0, 2900, 3600]   # <- WIDTH stays 2900. Set HEIGHT from your worksheet.
